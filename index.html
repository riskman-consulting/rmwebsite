<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1a3a" />

    <!-- Apply the saved theme before first paint, so a prerendered page does
         not show in light mode first for someone who chose dark. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <!-- Inter font: loaded without blocking first paint (it used to be a CSS
         @import, which held up rendering until Google Fonts answered). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://%VITE_SANITY_PROJECT_ID%.apicdn.sanity.io" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" />
    </noscript>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/rm-icon.png" />
    <link rel="apple-touch-icon" href="/rm-icon.png" />

    <!-- Primary SEO -->
    <title>RiskMan Consulting | Risk Advisory, Compliance & Resilience</title>
    <meta
      name="description"
      content="RiskMan Consulting helps organisations navigate risk, regulatory compliance, cybersecurity, ESG and digital transformation with expert advisory and resilient frameworks."
    />
    <link rel="canonical" href="https://www.riskman.in/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RiskMan Consulting" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.riskman.in/" />
    <meta
      property="og:title"
      content="RiskMan Consulting | Risk Advisory, Compliance & Resilience"
    />
    <meta
      property="og:description"
      content="Risk advisory, regulatory compliance, cybersecurity and digital transformation expertise for resilient, future-ready organisations."
    />
    <meta property="og:image" content="https://www.riskman.in/rm.png" />
    <meta property="og:image:secure_url" content="https://www.riskman.in/rm.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="400" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="RiskMan Consulting — Risk Advisory & Resilience"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="RiskMan Consulting | Risk Advisory, Compliance & Resilience"
    />
    <meta
      name="twitter:description"
      content="Risk advisory, regulatory compliance, cybersecurity and digital transformation expertise for resilient, future-ready organisations."
    />
    <meta name="twitter:image" content="https://www.riskman.in/rm.png" />
    <meta name="twitter:image:alt" content="RiskMan Consulting" />

    <!-- Organization schema (site-wide) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RiskMan Consulting",
        "url": "https://www.riskman.in/",
        "logo": "https://www.riskman.in/rm.png",
        "sameAs": ["https://www.linkedin.com/company/riskman-consulting"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
