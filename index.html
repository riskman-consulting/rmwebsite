    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/rm.png" />

    <!-- Primary SEO -->

      property="og:title"
      content="RiskMan Consulting | Risk Advisory, Compliance & Resilience"

      property="og:description"

    <meta property="og:image:secure_url" content="https://www.riskman.in/rm.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RiskMan Consulting — Risk Advisory & Resilience"
    />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
